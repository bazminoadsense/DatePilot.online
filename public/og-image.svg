  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#5a6464">Calculate dates, age, working days, week numbers, and time zones.</text>
  <rect x="80" y="500" width="280" height="6" rx="3" fill="#c45a36"/>
