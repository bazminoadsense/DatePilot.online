  <text x="270" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#172021">DatePilot</text>
  <text x="270" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#c45a36">datepilot.online</text>
